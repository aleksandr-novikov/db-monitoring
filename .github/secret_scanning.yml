# Suppress GitHub secret-scanning false positives inside tests.
#
# Why: test files contain synthetic credentials whose format matches the
# detection patterns (Telegram bot tokens, DSN-like strings, …) but the
# values are obviously fake — see tests/test_project_notifications.py
# constants ``_FAKE_TG_TOKEN`` etc. Real secrets must never live in
# tracked files anyway; the scanner's job there is purely noise.
#
# Anything outside tests/ is still scanned.
paths-ignore:
  - "tests/**"
