services:
  postgres:
    image: postgres:18
    container_name: db-monitoring-pg
    environment:
      POSTGRES_DB: monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monitor"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # TimescaleDB backend for the metrics store (#40). Opt-in service —
  # not started by default. Use `docker compose up -d timescaledb` to launch,
  # then point MONITOR_DB_URL at it:
  #   MONITOR_DB_URL=postgresql://postgres:dev@localhost:5433/metrics
  # Runs on port 5433 to avoid clashing with the monitored Postgres above.
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: db-monitoring-timescale
    profiles: ["timescale"]
    environment:
      POSTGRES_DB: metrics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d metrics"]
      interval: 2s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: db-monitoring
    container_name: db-monitoring-app
    env_file: .env
    environment:
      # Перекрываем DSN из .env: внутри сети compose БД доступна как `postgres`, а не localhost.
      DATABASE_URL: postgresql://postgres:dev@postgres:5432/monitor
    ports:
      - "${PORT:-5001}:5001"
    volumes:
      - ./monitor.db:/app/monitor.db
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ── Apache Iceberg smoke-test backend (#128) ─────────────────────────
  # Start with: make iceberg-up   Stop with: make iceberg-down
  #
  # MinIO — S3-совместимое хранилище для файлов Iceberg-таблиц.
  minio:
    image: minio/minio:latest
    container_name: db-monitoring-minio
    profiles: ["iceberg"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Iceberg REST-каталог — хранит метаданные таблиц, смотрит в MinIO.
  iceberg-rest:
    image: tabulario/iceberg-rest:latest
    container_name: db-monitoring-iceberg-rest
    profiles: ["iceberg"]
    environment:
      CATALOG_WAREHOUSE: s3://iceberg-smoke/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_ACCESS__KEY__ID: minioadmin
      CATALOG_S3_SECRET__ACCESS__KEY: minioadmin
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181' 2>/dev/null || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      minio:
        condition: service_healthy

volumes:
  pg_data:
  timescale_data:
